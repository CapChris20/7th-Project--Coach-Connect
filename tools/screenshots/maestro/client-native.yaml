# Captures native-only client surfaces. Requires simulator + SCREENSHOT_CLIENT_* env.
appId: ${APP_ID}
---
- launchApp
- tapOn: "Sign In"
- tapOn:
    id: "Login email"
    optional: true
- inputText: ${SCREENSHOT_CLIENT_EMAIL}
- tapOn:
    id: "Login password"
    optional: true
- inputText: ${SCREENSHOT_CLIENT_PASSWORD}
- tapOn: "Submit login"
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
    optional: true
# Nutrition → barcode (camera)
- tapOn:
    text: "Nutrition"
    optional: true
- tapOn:
    text: "Scan"
    optional: true
- takeScreenshot: client-barcode-scanner
- back
- back
# Add file (camera/docs)
- tapOn:
    text: "Home"
    optional: true
- tapOn:
    text: ".*"
    index: 0
    optional: true
- takeScreenshot: client-add-file
