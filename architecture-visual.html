<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Coach Connect — Architecture Map</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
    background: #0A0A0F;
    color: #e8e8ec;
    min-height: 100vh;
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky; top: 0; z-index: 10;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(12px);
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  h1 span { background: linear-gradient(90deg,#FF6B9D,#C084FC); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { color: rgba(255,255,255,0.5); font-size: 13px; margin-top: 4px; }
  .toolbar { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .search {
    flex: 1; min-width: 200px; max-width: 420px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 10px 14px; color: #fff; font-size: 14px; outline: none;
  }
  .search:focus { border-color: #FF6B9D; }
  .pill {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.15); cursor: pointer; background: transparent; color: #ccc;
  }
  .pill.active { background: rgba(255,107,157,0.2); border-color: #FF6B9D; color: #ffb3cc; }
  .layout { display: grid; grid-template-columns: 1fr 380px; gap: 0; min-height: calc(100vh - 120px); }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .sidebar { max-height: 50vh; } }
  .main { padding: 20px 24px; overflow: auto; }
  .sidebar {
    border-left: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.02);
    overflow: auto; padding: 16px;
  }
  .diagram-wrap {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 24px; margin-bottom: 20px;
  }
  .diagram-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.45); margin-bottom: 16px; }
  svg text { font-family: inherit; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.6); }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .zone-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .zone {
    border-radius: 14px; padding: 14px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.15s, border-color 0.15s;
  }
  .zone:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.25); }
  .zone.active { border-color: #FF6B9D; box-shadow: 0 0 0 1px rgba(255,107,157,0.3); }
  .zone-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .zone-count { font-size: 12px; color: rgba(255,255,255,0.45); }
  .zone-desc { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 6px; line-height: 1.4; }
  .tree-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: rgba(255,255,255,0.4); margin-bottom: 12px; }
  .tree { font-size: 13px; line-height: 1.6; }
  .folder, .file { user-select: none; }
  .folder-row, .file-row {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 6px; border-radius: 6px; cursor: pointer;
  }
  .folder-row:hover, .file-row:hover { background: rgba(255,255,255,0.06); }
  .file-row.highlight { background: rgba(255,107,157,0.15); }
  .chevron { width: 14px; font-size: 10px; color: rgba(255,255,255,0.35); flex-shrink: 0; }
  .chevron.open { transform: rotate(90deg); display: inline-block; }
  .icon-folder { color: #F97316; }
  .icon-file { color: rgba(255,255,255,0.4); font-size: 11px; }
  .indent { margin-left: 16px; border-left: 1px solid rgba(255,255,255,0.06); }
  .hidden { display: none; }
  .stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px 18px; border: 1px solid rgba(255,255,255,0.08); }
  .stat-val { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
  .stat-lbl { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }
</style>
</head>
<body>
<header>
  <h1><span>Coach Connect</span> Architecture</h1>
  <p class="sub">355 source files · Firebase anatrox-auth · Expo 54 + Cloud Run</p>
  <div class="toolbar">
    <input class="search" id="search" placeholder="Search files… (e.g. NutritionScreen, aiCoach)" autofocus/>
    <button class="pill active" data-filter="all">All</button>
    <button class="pill" data-filter="src">src/</button>
    <button class="pill" data-filter="server">server/</button>
    <button class="pill" data-filter="functions">functions/</button>
    <button class="pill" id="expandAll">Expand all</button>
    <button class="pill" id="collapseAll">Collapse all</button>
  </div>
</header>
<div class="layout">
  <div class="main">
    <div class="stats">
      <div class="stat"><div class="stat-val">310</div><div class="stat-lbl">Mobile files</div></div>
      <div class="stat"><div class="stat-val">39</div><div class="stat-lbl">Server files</div></div>
      <div class="stat"><div class="stat-val">5</div><div class="stat-lbl">Cloud Functions</div></div>
      <div class="stat"><div class="stat-val">2</div><div class="stat-lbl">App roles (client + trainer)</div></div>
    </div>
    <div class="diagram-wrap">
      <div class="diagram-title">System flow</div>
      <svg id="archSvg" width="100%" viewBox="0 0 720 320" style="max-width:720px;display:block;margin:0 auto"></svg>
      <div class="legend">
        <div class="legend-item"><div class="dot" style="background:#FF6B9D"></div>Mobile</div>
        <div class="legend-item"><div class="dot" style="background:#06B6D4"></div>Cloud Run API</div>
        <div class="legend-item"><div class="dot" style="background:#C084FC"></div>Firebase</div>
        <div class="legend-item"><div class="dot" style="background:#F97316"></div>Cloud Functions</div>
      </div>
    </div>
    <div class="diagram-title" style="margin-bottom:12px">Code zones — click to filter file tree</div>
    <div class="zone-grid" id="zones"></div>
  </div>
  <div class="sidebar">
    <div class="tree-title">All files</div>
    <div class="tree" id="tree"></div>
  </div>
</div>

function drawDiagram() {

  const nodes = [
    { x:360,y:30,w:100,h:32,label:'App.js',fill:'#1a1520',stroke:'#F97316' },
    { x:360,y:80,w:100,h:32,label:'AuthGate',fill:'#1a1520',stroke:'#FF6B9D' },

    { x:480,y:140,w:110,h:32,label:'TrainerApp',fill:'#1a1520',stroke:'#FF6B9D' },
    { x:140,y:220,w:120,h:32,label:'Firestore',fill:'#15102a',stroke:'#C084FC' },
    { x:360,y:220,w:120,h:32,label:'Cloud Run API',fill:'#0a1a22',stroke:'#06B6D4' },
    { x:580,y:220,w:110,h:32,label:'Firebase Auth',fill:'#15102a',stroke:'#C084FC' },
    { x:360,y:280,w:130,h:32,label:'Cloud Functions',fill:'#15102a',stroke:'#8B5CF6' },
  ];
  const edges = [
    [0,1],[1,2],[1,3],[2,4],[3,4],[2,5],[3,5],[2,6],[3,6],[5,4],[5,6],[5,7]
  ];
  let s = '';
  edges.forEach(([a,b]) => {
    const A=nodes[a],B=nodes[b];
    s += '<line x1="'+(A.x+A.w/2)+'" y1="'+(A.y+A.h)+'" x2="'+(B.x+B.w/2)+'" y2="'+B.y+'" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>';
  });
  nodes.forEach(n => {
    s += '<rect x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" rx="8" fill="'+n.fill+'" stroke="'+n.stroke+'" stroke-width="1.5"/>';
    s += '<text x="'+(n.x+n.w/2)+'" y="'+(n.y+n.h/2+4)+'" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">'+n.label+'</text>';
  });
  svg.innerHTML = s;
}

function countFiles(prefix) {
  return FILES.filter(f => f.startsWith(prefix)).length;
}

function renderZones() {
  document.getElementById('zones').innerHTML = ZONES.map(z => {
    const c = countFiles(z.filter);
    return '<div class="zone'+(activeZone===z.id?' active':'')+'" data-zone="'+z.id+'" style="background:'+z.color+'18;border-color:'+z.color+'44">'+
      '<div class="zone-name" style="color:'+z.color+'">'+z.name+'</div>'+
      '<div class="zone-count">'+c+' files</div>'+
      '<div class="zone-desc">'+z.desc+'</div></div>';
  }).join('');
  document.querySelectorAll('.zone').forEach(el => {
    el.onclick = () => {
      const z = ZONES.find(x => x.id === el.dataset.zone);
      activeZone = activeZone === z.id ? null : z.id;
      activeFilter = activeZone ? z.filter : 'all';
      document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.filter === activeFilter));
      renderZones(); renderTree(document.getElementById('search').value);
    };
  });
}

function renderTree(search='') {
  const q = search.toLowerCase().trim();
  const filterPrefix = activeFilter === 'all' ? '' : activeFilter;

  function matches(path) {
    if (filterPrefix && !path.startsWith(filterPrefix) && !path.includes('/'+filterPrefix.split('/').pop())) return false;
    if (q && !path.toLowerCase().includes(q)) return false;
    return true;
  }

  function renderNode(node, path='', depth=0) {
    if (node.type === 'file') {
      if (!matches(node.path)) return '';
      const hl = q && node.path.toLowerCase().includes(q) ? ' highlight' : '';
      return '<div class="file-row'+hl+'" data-path="'+node.path+'"><span class="icon-file">·</span><span>'+node.name+'</span></div>';
    }
    const fullPath = path ? path+'/'+node.name : node.name;
    if (node.name === 'coachconnect-app') {
      return node.children.map(c => renderNode(c, '', 0)).join('');
    }
    let childHtml = '';
    for (const c of node.children) {
      childHtml += renderNode(c, fullPath, depth + 1);
    }
    if (!childHtml) return '';
    const id = 'f-'+fullPath.replace(/[^a-z0-9]/gi,'-');
    const startOpen = q ? true : depth < 1;
    const chevClass = startOpen ? 'chevron open' : 'chevron';
    const indentClass = startOpen ? 'indent' : 'indent hidden';
    return '<div class="folder"><div class="folder-row" onclick="toggleFolder(\''+id+'\')">'+
      '<span class="'+chevClass+'" id="ch-'+id+'">▶</span><span class="icon-folder">▸</span><span style="font-weight:600">'+node.name+'</span></div>'+
      '<div class="'+indentClass+'" id="'+id+'">'+childHtml+'</div></div>';
  }

  document.getElementById('tree').innerHTML = renderNode(TREE) || '<div style="color:rgba(255,255,255,0.4);padding:12px">No matches</div>';
  document.querySelectorAll('.file-row').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      navigator.clipboard?.writeText(el.dataset.path);
      el.style.background = 'rgba(6,182,212,0.2)';
      setTimeout(() => el.style.background = '', 600);
    };
    el.title = 'Click to copy path';
  });
}

window.toggleFolder = function(id) {
  const el = document.getElementById(id);
  const ch = document.getElementById('ch-'+id);
  if (!el) return;
  el.classList.toggle('hidden');
  ch.classList.toggle('open');
};

document.getElementById('search').addEventListener('input', e => renderTree(e.target.value));
document.querySelectorAll('.pill').forEach(p => {
  p.onclick = () => {
    activeZone = null;
    activeFilter = p.dataset.filter;
    document.querySelectorAll('.pill').forEach(x => x.classList.toggle('active', x === p));
    renderZones(); renderTree(document.getElementById('search').value);
  };
});

drawDiagram(); renderZones(); renderTree();
</script>
</body>
</html>
