<style>/* Layout: tabs of phone boards. System: thick GRADIENT outlines and gradient hard shadows. No purple borders. */

}

:root[data-theme="dark"]{
  --bg:#0A0A0F; --surface:#15151C; --chip:#1D1D26; --ink:#F6F2F4; --muted:#A6A0AE; --line:rgba(255,255,255,.14); --page:#050508; --danger:#F87171; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sys);padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.scrollx{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 10px;scrollbar-width:none}.scrollx::-webkit-scrollbar{display:none}.scrollx>*{flex:none}

.opt .ck{margin-left:auto}

@supports (animation-timeline:view()){@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}}}
@keyframes draw{from{stroke-dashoffset:var(--circ)}}

/* ===== Neo-brutalist black / white / gray primary system. Gradients are secondary accents only. ===== */
:root{--bg:#F2F2F0;--surface:#FFFFFF;--chip:#FFFFFF;--ink:#0A0A0A;--muted:#5C5C5C;--line:rgba(10,10,10,.16);--page:#E4E4DF;--nbk:#0A0A0A;--on-nbk:#FFFFFF;--nbs:#0A0A0A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0B;--surface:#161616;--chip:#1F1F1F;--ink:#F2F2F2;--muted:#A0A0A0;--line:rgba(255,255,255,.18);--page:#050505;--nbk:#F2F2F2;--on-nbk:#0A0A0A;--nbs:#8A8A8A;--danger:#F87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0B;--surface:#161616;--chip:#1F1F1F;--ink:#F2F2F2;--muted:#A0A0A0;--line:rgba(255,255,255,.18);--page:#050505;--nbk:#F2F2F2;--on-nbk:#0A0A0A;--nbs:#8A8A8A;--danger:#F87171;color-scheme:dark}
body{background:var(--page)}
.board h2,.board>p{color:#5C5C5C}
.nb{--bd:linear-gradient(var(--nbk),var(--nbk))}
.nb-shadow{background:var(--nbs)!important;filter:none}
.phone{border:3px solid var(--nbk);background:var(--bg);box-shadow:8px 8px 0 var(--nbs)}
.tool{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(#0A0A0A,#0A0A0A) border-box;color:#0A0A0A}
/* primary = black */
.btn.brand .nb-box{--fill:linear-gradient(var(--nbk),var(--nbk));color:var(--on-nbk)}
.chip[aria-pressed="true"] .nb-box,.tilebtn[aria-pressed="true"] .nb-box{--fill:linear-gradient(var(--nbk),var(--nbk));color:var(--on-nbk)}
.seg{border:3px solid var(--nbk);background:var(--chip)}
.seg button[aria-pressed="true"]{background:var(--nbk);color:var(--on-nbk)}
.seg button+button{border-left:2px solid var(--nbk)}

/* ---------- render ---------- */
var TABS=[['browse','Browse'],['profile','Profile'],['connect','Connect']];
var TABACC={start:'sun',home:'sun',eat:'sun',trainer:'sun',market:'sun',browse:'sun',profile:'sun',connect:'sun'};
var ACC={};
var tabsEl=document.getElementById('tabs'),boards=document.getElementById('boards'),cache={};
tabsEl.innerHTML=TABS.map(function(t){return '<button type="button" data-tab="'+t[0]+'" aria-pressed="false">'+t[1]+'<small>'+S[t[0]].length+'</small></button>'}).join('');
function lots(){[].forEach.call(boards.querySelectorAll('[data-lot]'),function(el){var f=el.getAttribute('data-lot');(cache[f]=cache[f]||fetch(f).then(function(r){return r.json()})).then(function(d){if(window.lottie)lottie.loadAnimation({container:el,renderer:'svg',loop:true,autoplay:!matchMedia('(prefers-reduced-motion: reduce)').matches,animationData:JSON.parse(JSON.stringify(d))})}).catch(function(){})})}
function show(id){
  if(!S[id])id='browse';
  [].forEach.call(tabsEl.children,function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-tab')===id))});
  boards.innerHTML=S[id].map(function(s){var o=Object.assign({},s[3]||{});o.acc=ACC[s[0]]||TABACC[id];return ph(s[0],s[1],s[2],o)}).join('');
  paint(boards);lots();try{history.replaceState(null,'','#'+id)}catch(e){}
}
tabsEl.addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)show(b.getAttribute('data-tab'))});
boards.addEventListener('click',function(e){
  var s=e.target.closest('.sw');if(s){s.setAttribute('aria-pressed',String(s.getAttribute('aria-pressed')!=='true'));return}
  var b=e.target.closest('[aria-pressed]');if(!b)return;
  var g=b.closest('[data-multi],[data-single]');if(!g)return;
  if(g.hasAttribute('data-multi'))b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));
  else [].forEach.call(g.querySelectorAll('[aria-pressed]'),function(x){x.setAttribute('aria-pressed',String(x===b))});
});
boards.addEventListener('input',function(e){var r=e.target.closest('.vrange');if(!r)return;var pct=(r.value-r.min)/(r.max-r.min)*100;r.style.background='linear-gradient(90deg,var(--acc-a),var(--acc-b)) 0/'+pct+'% 100% no-repeat,var(--line)';var o=r.parentNode.querySelector('[data-out]');if(o)o.textContent='$'+r.value});
var root=document.documentElement,tb=document.getElementById('theme');
function dark(){var a=root.getAttribute('data-theme');return a?a==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function lab(){tb.textContent=dark()?'Switch to light':'Switch to dark'}
tb.addEventListener('click',function(){root.setAttribute('data-theme',dark()?'light':'dark');lab()});lab();
show((location.hash||'').slice(1));
window.addEventListener('hashchange',function(){show((location.hash||'').slice(1))});
})();
