# Complete nutrition calorie/macro onboarding when first-time user hits Nutrition tab
appId: com.coachconnect
---
- runFlow:
    when:
      visible: "Set Your Calorie Goal"
    commands:
      - tapOn: "Next"
      - extendedWaitUntil:
          visible: "Set Your Macros"
          timeout: 10000
      - tapOn: "Next"
      - extendedWaitUntil:
          visible: "Your Favorite Foods"
          timeout: 10000
      - tapOn: "Finish Setup"
      - extendedWaitUntil:
          visible: "Nutrition"
          timeout: 30000
