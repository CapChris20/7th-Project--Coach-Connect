# Search for MAESTRO_FOOD_QUERY and log the first result
# Requires: MAESTRO_FOOD_QUERY (e.g. "Chick-fil-A original chicken sandwich")
# API server must be running for restaurant/brand results (npm run server)
appId: com.coachconnect
---
- tapOn: "Search foods"
- eraseText
- inputText: ${MAESTRO_FOOD_QUERY}
- extendedWaitUntil:
    visible: "Search results"
    timeout: 90000
- assertVisible: "CAL"
- tapOn:
    text: "Add food to log"
    index: 0
- extendedWaitUntil:
    visible: "Confirm & log"
    timeout: 15000
- tapOn: "Log it"
- extendedWaitUntil:
    visible: "Nutrition"
    timeout: 30000
